<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
<style>
  .box { fill:#ffffff; stroke:#111827; stroke-width:1.5; rx:8; ry:8; }
  .title { font: 14px sans-serif; fill:#111827; font-weight:600; }
  .text { font: 12px sans-serif; fill:#111827; }
  .arrow { stroke:#111827; stroke-width:1.2; fill:none; marker-end:url(#arrow); }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#111827" />
  </marker>
</defs>

<rect class="box" x="350" y="60" width="220" height="50"/><text class="text" x="460" y="90" text-anchor="middle">Resolver Context (override)</text>
<rect class="box" x="350" y="150" width="220" height="50"/><text class="text" x="460" y="180" text-anchor="middle">Palette Context (default)</text>
<rect class="box" x="350" y="240" width="220" height="50"/><text class="text" x="460" y="270" text-anchor="middle">System Default</text>

<path class="arrow" d="M460 110 L460 150"/>
<path class="arrow" d="M460 200 L460 240"/>

</svg>