<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
<style>
  .box { fill:#ffffff; stroke:#111827; stroke-width:1.5; rx:8; ry:8; }
  .title { font: 14px sans-serif; fill:#111827; font-weight:600; }
  .text { font: 12px sans-serif; fill:#111827; }
  .arrow { stroke:#111827; stroke-width:1.2; fill:none; marker-end:url(#arrow); }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#111827" />
  </marker>
</defs>

<rect class="box" x="80" y="80" width="160" height="50"/><text class="text" x="160" y="110" text-anchor="middle">fill</text>
<rect class="box" x="80" y="150" width="160" height="50"/><text class="text" x="160" y="180" text-anchor="middle">lines</text>
<rect class="box" x="80" y="220" width="160" height="50"/><text class="text" x="160" y="250" text-anchor="middle">visualVocabulary</text>
<rect class="box" x="80" y="290" width="160" height="50"/><text class="text" x="160" y="320" text-anchor="middle">overlays</text>

<rect class="box" x="420" y="120" width="200" height="50"/><text class="text" x="520" y="150" text-anchor="middle">on (contrast)</text>
<rect class="box" x="420" y="210" width="200" height="50"/><text class="text" x="520" y="240" text-anchor="middle">over (overlay)</text>
<rect class="box" x="420" y="300" width="200" height="50"/><text class="text" x="520" y="330" text-anchor="middle">under (shadow)</text>

<path class="arrow" d="M240 105 L420 145"/>
<path class="arrow" d="M240 175 L420 145"/>
<path class="arrow" d="M240 245 L420 145"/>

<path class="arrow" d="M240 315 L420 235"/>
<path class="arrow" d="M240 315 L420 325"/>

</svg>